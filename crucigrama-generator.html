<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Crucigramas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 30px;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: start;
        }
        
        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .input-section {
            /* no margin needed in grid layout */
        }
        
        .preview-section {
            position: sticky;
            top: 20px;
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #e0e7ff;
        }
        
        .preview-section h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
            overflow: auto;
        }
        
        .preview-empty {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }
        
        .word-count {
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        
        .word-count.complete {
            background: #d1fae5;
            color: #065f46;
            font-weight: bold;
        }
        
        .solution-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
        }
        
        .nav-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
        }
        
        .nav-button:hover:not(:disabled) {
            background: #5568d3;
            transform: scale(1.05);
        }
        
        .nav-button:disabled {
            background: #ddd;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .solution-counter {
            font-weight: bold;
            color: #667eea;
            min-width: 100px;
            text-align: center;
        }
        
        .title-input {
            margin-bottom: 20px;
        }
        
        .title-input label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .title-input input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .words-input label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }
        
        .words-input textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            resize: vertical;
        }
        
        .helper-text {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
            font-style: italic;
        }
        
        .button-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-generate {
            background: #667eea;
            color: white;
            flex: 1;
        }
        
        .btn-generate:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-generate:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            margin-top: 30px;
            display: none;
        }
        
        .results-section.active {
            display: block;
        }
        
        .error-message {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .solutions-container {
            margin-bottom: 20px;
        }
        
        .solution-option {
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .solution-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .solution-option.selected {
            border-color: #667eea;
            background: #e8ebff;
        }
        
        .solution-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .solution-title {
            font-weight: bold;
            color: #333;
            font-size: 18px;
        }
        
        .solution-info {
            color: #666;
            font-size: 14px;
        }
        
        .crossword-grid {
            display: inline-grid;
            gap: 1px;
            background: #333;
            border: 2px solid #333;
            padding: 1px;
        }
        
        .crossword-cell {
            width: 30px;
            height: 30px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            position: relative;
        }
        
        .crossword-cell.black {
            background: #333;
        }
        
        .crossword-cell .number {
            position: absolute;
            top: 1px;
            left: 2px;
            font-size: 9px;
            color: #667eea;
            font-weight: bold;
        }
        
        .btn-download {
            background: #10b981;
            color: white;
        }
        
        .btn-download:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
        }
        
        .btn-back {
            background: #6b7280;
            color: white;
        }
        
        .btn-back:hover {
            background: #4b5563;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧩 Generador de Crucigramas</h1>
        
        <div class="main-content" id="mainContent">
            <div class="input-section" id="inputSection">
                <div class="title-input">
                    <label for="titleInput">Título (fecha):</label>
                    <input type="text" id="titleInput" placeholder="2026-03-04" value="" oninput="updatePreview()">
                </div>
                
                <div class="words-input">
                    <label for="wordsInput">Palabras y pistas (8 palabras):</label>
                    <textarea id="wordsInput" placeholder="CEFERIN Presidente de la UEFA desde 2016
PACHUCA Club mexicano conocido como los Tuzos
PARADINHA Pausa antes de lanzar un penalti para despistar al portero
..." oninput="updatePreview()"></textarea>
                    <div class="helper-text">
                        Formato: PALABRA descripción de la pista<br>
                        Una palabra por línea. Total: 8 palabras.
                    </div>
                </div>
                
                <div class="button-container">
                    <button class="btn-generate" onclick="finalizeCrossword()" id="finalizeBtn" disabled>Finalizar y Descargar JSON</button>
                </div>
            </div>
            
            <div class="preview-section">
                <h2>Vista Previa</h2>
                <div class="preview-container" id="previewContainer">
                    <div class="preview-empty">
                        Escribe las palabras y las verás aparecer aquí en tiempo real
                    </div>
                </div>
                <div id="solutionNav" style="display: none;">
                    <div class="solution-navigation">
                        <button class="nav-button" onclick="previousSolution()" id="prevBtn">←</button>
                        <span class="solution-counter" id="solutionCounter">1 / 1</span>
                        <button class="nav-button" onclick="nextSolution()" id="nextBtn">→</button>
                    </div>
                </div>
                <div class="word-count" id="wordCount">0 / 8 palabras</div>
            </div>
        </div>
        
        <div class="results-section" id="resultsSection">
            <div id="resultsContent"></div>
            <div class="button-container">
                <button class="btn-back" onclick="goBack()">← Volver</button>
                <button class="btn-download" onclick="downloadJSON()" id="downloadBtn" style="display: none;">Descargar JSON</button>
            </div>
        </div>
    </div>

    <script>
        let selectedSolution = null;
        let allSolutions = [];
        let currentSolution = null;
        let previewSolutions = [];
        let currentSolutionIndex = 0;

        class CrosswordGenerator {
            constructor(words) {
                this.words = words.map(w => ({
                    word: w.word.toUpperCase(),
                    clue: w.clue
                }));
                this.maxWidth = 15;
                this.maxHeight = 13;
            }

            generate() {
                const solutions = [];
                
                // Probar con cada palabra como primera palabra
                for (let i = 0; i < this.words.length; i++) {
                    // Probar horizontal
                    const solutionH = this.buildCrossword(i, 'across');
                    if (solutionH) {
                        solutions.push(solutionH);
                    }
                    
                    // Probar vertical
                    const solutionV = this.buildCrossword(i, 'down');
                    if (solutionV) {
                        solutions.push(solutionV);
                    }
                }
                
                if (solutions.length === 0) return [];
                
                // Ordenar por número de palabras colocadas (más es mejor)
                solutions.sort((a, b) => b.placedWords.length - a.placedWords.length);
                
                // Devolver todas las soluciones que tienen el máximo de palabras
                const maxWords = solutions[0].placedWords.length;
                const bestSolutions = solutions.filter(s => s.placedWords.length === maxWords);
                
                // Eliminar duplicados (mismas palabras en mismas posiciones)
                const unique = [];
                for (const sol of bestSolutions) {
                    const key = sol.words.map(w => `${w.answer}-${w.row}-${w.col}-${w.direction}`).sort().join('|');
                    if (!unique.find(u => {
                        const uKey = u.words.map(w => `${w.answer}-${w.row}-${w.col}-${w.direction}`).sort().join('|');
                        return uKey === key;
                    })) {
                        unique.push(sol);
                    }
                }
                
                return unique;
            }

            buildCrossword(firstWordIdx, firstDirection) {
                const grid = {};
                const placedWords = [];
                const usedIndices = new Set([firstWordIdx]);
                
                // Colocar primera palabra
                const firstWord = this.words[firstWordIdx];
                const startRow = 6;
                const startCol = 7;
                
                this.addWordToGrid(grid, firstWord.word, startRow, startCol, firstDirection, placedWords, firstWord.clue);
                
                // Intentar colocar cada palabra restante
                let changed = true;
                while (changed && usedIndices.size < this.words.length) {
                    changed = false;
                    
                    for (let i = 0; i < this.words.length; i++) {
                        if (usedIndices.has(i)) continue;
                        
                        const word = this.words[i];
                        const placements = this.findAllPlacements(grid, word.word, placedWords);
                        
                        if (placements.length > 0) {
                            // Elegir el placement con más intersecciones
                            placements.sort((a, b) => b.intersections - a.intersections);
                            const best = placements[0];
                            
                            this.addWordToGrid(grid, word.word, best.row, best.col, best.direction, placedWords, word.clue);
                            usedIndices.add(i);
                            changed = true;
                        }
                    }
                }
                
                return this.formatGrid(grid, placedWords);
            }

            findAllPlacements(grid, word, placedWords) {
                const placements = [];
                
                for (const placed of placedWords) {
                    // Intentar cruzar en cada posición
                    for (let i = 0; i < word.length; i++) {
                        for (let j = 0; j < placed.word.length; j++) {
                            if (word[i] !== placed.word[j]) continue;
                            
                            const direction = placed.direction === 'across' ? 'down' : 'across';
                            let row, col;
                            
                            if (direction === 'across') {
                                row = placed.direction === 'across' ? placed.row : placed.row + j;
                                col = placed.direction === 'across' ? placed.col + j - i : placed.col - i;
                            } else {
                                row = placed.direction === 'across' ? placed.row - i : placed.row + j - i;
                                col = placed.direction === 'across' ? placed.col + j : placed.col;
                            }
                            
                            if (this.canPlaceWord(grid, word, row, col, direction)) {
                                const intersections = this.countIntersections(grid, word, row, col, direction, placedWords);
                                placements.push({ row, col, direction, intersections });
                            }
                        }
                    }
                }
                
                return placements;
            }

            countIntersections(grid, word, row, col, direction, placedWords) {
                let count = 0;
                for (let i = 0; i < word.length; i++) {
                    const r = direction === 'across' ? row : row + i;
                    const c = direction === 'across' ? col + i : col;
                    const key = `${r},${c}`;
                    if (grid[key] && grid[key] === word[i]) {
                        count++;
                    }
                }
                return count;
            }


            canPlaceWord(grid, word, row, col, direction) {
                // Verificar límites
                const endRow = direction === 'across' ? row : row + word.length - 1;
                const endCol = direction === 'across' ? col + word.length - 1 : col;
                
                if (row < 0 || col < 0 || endRow >= this.maxHeight || endCol >= this.maxWidth) {
                    return false;
                }
                
                // Verificar cada celda de la palabra
                for (let i = 0; i < word.length; i++) {
                    const r = direction === 'across' ? row : row + i;
                    const c = direction === 'across' ? col + i : col;
                    const key = `${r},${c}`;
                    
                    // Si hay una letra, debe coincidir
                    if (grid[key]) {
                        if (grid[key] !== word[i]) {
                            return false;
                        }
                    } else {
                        // Verificar que no haya letras paralelas adyacentes
                        if (direction === 'across') {
                            // Verificar arriba y abajo
                            const above = `${r-1},${c}`;
                            const below = `${r+1},${c}`;
                            if (grid[above] || grid[below]) {
                                // Solo OK si es una intersección (hay letra en nuestra posición)
                                if (!grid[key]) {
                                    return false;
                                }
                            }
                        } else {
                            // Verificar izquierda y derecha
                            const left = `${r},${c-1}`;
                            const right = `${r},${c+1}`;
                            if (grid[left] || grid[right]) {
                                if (!grid[key]) {
                                    return false;
                                }
                            }
                        }
                    }
                }
                
                // Verificar espacios antes y después de la palabra
                if (direction === 'across') {
                    const before = `${row},${col-1}`;
                    const after = `${row},${col+word.length}`;
                    if (grid[before] || grid[after]) {
                        return false;
                    }
                } else {
                    const before = `${row-1},${col}`;
                    const after = `${row+word.length},${col}`;
                    if (grid[before] || grid[after]) {
                        return false;
                    }
                }
                
                return true;
            }

            addWordToGrid(grid, word, row, col, direction, placedWords, clue) {
                for (let i = 0; i < word.length; i++) {
                    const r = direction === 'across' ? row : row + i;
                    const c = direction === 'across' ? col + i : col;
                    grid[`${r},${c}`] = word[i];
                }
                
                placedWords.push({
                    word,
                    row,
                    col,
                    direction,
                    length: word.length,
                    clue
                });
            }

            placeWord(grid, word, row, col, direction, placedWords, clue) {
                for (let i = 0; i < word.length; i++) {
                    const r = direction === 'across' ? row : row + i;
                    const c = direction === 'across' ? col + i : col;
                    grid[`${r},${c}`] = word[i];
                }
                
                placedWords.push({
                    word,
                    row,
                    col,
                    direction,
                    length: word.length,
                    clue
                });
            }

            formatGrid(grid, placedWords) {
                // Encontrar límites del grid
                const keys = Object.keys(grid);
                if (keys.length === 0) return null;
                
                const rows = keys.map(k => parseInt(k.split(',')[0]));
                const cols = keys.map(k => parseInt(k.split(',')[1]));
                
                const minRow = Math.min(...rows);
                const maxRow = Math.max(...rows);
                const minCol = Math.min(...cols);
                const maxCol = Math.max(...cols);
                
                const height = maxRow - minRow + 1;
                const width = maxCol - minCol + 1;
                
                // Crear grid 2D
                const gridArray = Array(height).fill(null).map(() => Array(width).fill(0));
                
                // Llenar grid
                for (const key in grid) {
                    const [r, c] = key.split(',').map(Number);
                    gridArray[r - minRow][c - minCol] = 1;
                }
                
                // Ajustar coordenadas de palabras
                const adjustedWords = placedWords.map(pw => ({
                    ...pw,
                    row: pw.row - minRow,
                    col: pw.col - minCol
                }));
                
                // Asignar números
                const numbered = this.assignNumbers(adjustedWords, height, width);
                
                return {
                    grid: gridArray,
                    words: numbered,
                    width,
                    height,
                    placedWords: adjustedWords
                };
            }

            assignNumbers(words, height, width) {
                const starts = [];
                
                for (const word of words) {
                    const key = `${word.row},${word.col}`;
                    if (!starts.find(s => s.key === key)) {
                        starts.push({
                            key,
                            row: word.row,
                            col: word.col,
                            words: [word]
                        });
                    } else {
                        starts.find(s => s.key === key).words.push(word);
                    }
                }
                
                // Ordenar por posición (fila, luego columna)
                starts.sort((a, b) => {
                    if (a.row !== b.row) return a.row - b.row;
                    return a.col - b.col;
                });
                
                // Asignar números
                let number = 1;
                const numberedWords = [];
                
                for (const start of starts) {
                    for (const word of start.words) {
                        numberedWords.push({
                            number,
                            answer: word.word,
                            row: word.row,
                            col: word.col,
                            direction: word.direction,
                            length: word.length,
                            clue: word.clue
                        });
                    }
                    number++;
                }
                
                return numberedWords;
            }
        }

        function parseInput() {
            const title = document.getElementById('titleInput').value.trim();
            const text = document.getElementById('wordsInput').value.trim();
            
            if (!text) {
                return { title, words: [] };
            }
            
            const lines = text.split('\n').filter(line => line.trim());
            
            const words = [];
            for (const line of lines) {
                const match = line.match(/^(\S+)\s+(.+)$/);
                if (match) {
                    words.push({
                        word: match[1],
                        clue: match[2]
                    });
                }
            }
            
            return { title, words };
        }

        function updatePreview() {
            const input = parseInput();
            const wordCount = input.words.length;
            
            // Actualizar contador
            const countEl = document.getElementById('wordCount');
            countEl.textContent = `${wordCount} / 8 palabras`;
            countEl.classList.toggle('complete', wordCount === 8);
            
            // Habilitar/deshabilitar botón
            document.getElementById('finalizeBtn').disabled = wordCount !== 8 || !input.title;
            
            if (wordCount === 0) {
                document.getElementById('previewContainer').innerHTML = `
                    <div class="preview-empty">
                        Escribe las palabras y las verás aparecer aquí en tiempo real
                    </div>
                `;
                document.getElementById('solutionNav').style.display = 'none';
                currentSolution = null;
                previewSolutions = [];
                return;
            }
            
            // Generar crucigrama con las palabras que tengamos hasta ahora
            const generator = new CrosswordGenerator(input.words);
            const solutions = generator.generate();
            
            if (solutions.length === 0 || !solutions[0]) {
                // Si no hay solución, mostrar mensaje pero seguir intentando
                document.getElementById('previewContainer').innerHTML = `
                    <div class="preview-empty" style="color: #ef4444;">
                        ⚠️ Añade más palabras o modifica las existentes
                    </div>
                `;
                document.getElementById('solutionNav').style.display = 'none';
                currentSolution = null;
                previewSolutions = [];
                return;
            }
            
            // Guardar todas las soluciones y mostrar la primera
            previewSolutions = solutions.map(sol => ({
                ...sol,
                title: input.title
            }));
            currentSolutionIndex = 0;
            
            showCurrentSolution();
        }
        
        function showCurrentSolution() {
            if (previewSolutions.length === 0) return;
            
            currentSolution = previewSolutions[currentSolutionIndex];
            
            // Indicar cuántas palabras se pudieron colocar
            const placedCount = currentSolution.words.length;
            const totalWords = currentSolution.title ? parseInput().words.length : placedCount;
            
            let statusHtml = '';
            if (placedCount < totalWords) {
                statusHtml = `<div style="color: #ef4444; font-size: 12px; margin-top: 10px;">
                    ⚠️ ${placedCount} de ${totalWords} palabras colocadas
                </div>`;
            }
            
            document.getElementById('previewContainer').innerHTML = renderGrid(currentSolution, true) + statusHtml;
            
            // Mostrar/ocultar controles de navegación
            if (previewSolutions.length > 1) {
                document.getElementById('solutionNav').style.display = 'block';
                document.getElementById('solutionCounter').textContent = `${currentSolutionIndex + 1} / ${previewSolutions.length}`;
                document.getElementById('prevBtn').disabled = currentSolutionIndex === 0;
                document.getElementById('nextBtn').disabled = currentSolutionIndex === previewSolutions.length - 1;
            } else {
                document.getElementById('solutionNav').style.display = 'none';
            }
        }
        
        function previousSolution() {
            if (currentSolutionIndex > 0) {
                currentSolutionIndex--;
                showCurrentSolution();
            }
        }
        
        function nextSolution() {
            if (currentSolutionIndex < previewSolutions.length - 1) {
                currentSolutionIndex++;
                showCurrentSolution();
            }
        }

        function renderGrid(solution, showLetters = false) {
            const { grid, words, width, height } = solution;
            
            // Crear mapa de números
            const numbers = {};
            for (const word of words) {
                const key = `${word.row},${word.col}`;
                if (!numbers[key]) {
                    numbers[key] = word.number;
                }
            }
            
            // Crear mapa de letras
            const letters = {};
            if (showLetters) {
                for (const word of words) {
                    for (let i = 0; i < word.length; i++) {
                        const r = word.direction === 'across' ? word.row : word.row + i;
                        const c = word.direction === 'across' ? word.col + i : word.col;
                        letters[`${r},${c}`] = word.answer[i];
                    }
                }
            }
            
            let html = `<div class="crossword-grid" style="grid-template-columns: repeat(${width}, 30px);">`;
            
            for (let r = 0; r < height; r++) {
                for (let c = 0; c < width; c++) {
                    const isBlack = grid[r][c] === 0;
                    const key = `${r},${c}`;
                    const number = numbers[key];
                    const letter = letters[key];
                    
                    html += `<div class="crossword-cell ${isBlack ? 'black' : ''}">`;
                    if (number) {
                        html += `<span class="number">${number}</span>`;
                    }
                    if (letter) {
                        html += letter;
                    }
                    html += '</div>';
                }
            }
            
            html += '</div>';
            return html;
        }

        function finalizeCrossword() {
            if (!currentSolution) {
                alert('No hay crucigrama generado');
                return;
            }
            
            const json = {
                date: currentSolution.title,
                title: `Crucigrama #${currentSolution.title}`,
                grid_size: {
                    rows: currentSolution.height,
                    cols: currentSolution.width
                },
                grid: currentSolution.grid,
                words: currentSolution.words.map((w, idx) => ({
                    id: idx + 1,
                    number: w.number,
                    answer: w.answer,
                    row: w.row,
                    col: w.col,
                    direction: w.direction,
                    length: w.length,
                    clue: w.clue
                }))
            };
            
            const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentSolution.title}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function generateCrossword() {
            const input = parseInput();
            if (!input) return;
            
            // Mostrar loading
            document.getElementById('resultsContent').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Generando crucigrama...
                </div>
            `;
            document.getElementById('mainContent').style.display = 'none';
            document.getElementById('resultsSection').classList.add('active');
            
            // Generar en el siguiente frame para que se vea el loading
            setTimeout(() => {
                const generator = new CrosswordGenerator(input.words);
                const solutions = generator.generate();
                
                if (solutions.length === 0) {
                    document.getElementById('resultsContent').innerHTML = `
                        <div class="error-message">
                            ❌ No se pudo generar el crucigrama con estas palabras.<br>
                            Las letras no permiten crear intersecciones suficientes.<br>
                            Intenta con otras palabras.
                        </div>
                    `;
                    document.getElementById('downloadBtn').style.display = 'none';
                } else {
                    displaySolutions(solutions, input.title);
                }
            }, 100);
        }

        function displaySolutions(solutions, title) {
            allSolutions = solutions.map((sol, idx) => ({
                ...sol,
                title,
                index: idx
            }));
            
            let html = `<h2>✅ Se encontraron ${solutions.length} solución(es)</h2>`;
            html += '<div class="solutions-container">';
            
            solutions.forEach((solution, idx) => {
                html += `
                    <div class="solution-option" onclick="selectSolution(${idx})">
                        <div class="solution-header">
                            <div class="solution-title">Solución ${idx + 1}</div>
                            <div class="solution-info">${solution.width} × ${solution.height}</div>
                        </div>
                        ${renderGrid(solution)}
                    </div>
                `;
            });
            
            html += '</div>';
            
            document.getElementById('resultsContent').innerHTML = html;
            document.getElementById('downloadBtn').style.display = 'none';
        }

        function selectSolution(index) {
            selectedSolution = allSolutions[index];
            
            // Actualizar UI
            document.querySelectorAll('.solution-option').forEach((el, idx) => {
                el.classList.toggle('selected', idx === index);
            });
            
            document.getElementById('downloadBtn').style.display = 'block';
        }

        function downloadJSON() {
            if (!selectedSolution) {
                alert('Por favor, selecciona una solución primero');
                return;
            }
            
            const json = {
                date: selectedSolution.title,
                title: `Crucigrama #${selectedSolution.title}`,
                grid_size: {
                    rows: selectedSolution.height,
                    cols: selectedSolution.width
                },
                grid: selectedSolution.grid,
                words: selectedSolution.words.map((w, idx) => ({
                    id: idx + 1,
                    number: w.number,
                    answer: w.answer,
                    row: w.row,
                    col: w.col,
                    direction: w.direction,
                    length: w.length,
                    clue: w.clue
                }))
            };
            
            const blob = new Blob([JSON.stringify(json, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${selectedSolution.title}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function goBack() {
            document.getElementById('mainContent').style.display = 'grid';
            document.getElementById('resultsSection').classList.remove('active');
            selectedSolution = null;
            allSolutions = [];
        }
    </script>
</body>
</html>
