<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FutbolHUB · Design Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body data-mode="play">

  <header id="topbar">
    <div class="brand">⚽ FutbolHUB <span>Design Editor</span></div>
    <div class="nav">
      <button id="btn-back" title="Atrás">◄</button>
      <button id="btn-home" title="Ir al inicio">⌂ Inicio</button>
      <input id="start-path" type="text" value="/index.html" spellcheck="false">
      <span id="current-url" class="url"></span>
    </div>
    <div class="modes">
      <button id="btn-play" class="active">▷ Jugar</button>
      <button id="btn-edit">✎ Editar</button>
      <button id="btn-tokens">🎨 Tokens</button>
      <button id="btn-pause">⏸ Pausar</button>
    </div>
    <div class="devices">
      <button id="dev-mobile" title="Móvil 390px">📱</button>
      <button id="dev-tablet" title="Tablet 768px">📋</button>
      <button id="dev-desktop" class="active" title="Escritorio 1280px">🖥</button>
      <button id="dev-full" title="Completo (responsive)">⛶</button>
    </div>
  </header>

  <main>
    <div id="stage-area"><iframe id="stage" src="about:blank"></iframe></div>

    <!-- Panel de elemento -->
    <aside id="panel" class="hidden">
      <div class="panel-head">
        <h2>Propiedades</h2>
        <code id="sel-tag">—</code>
      </div>
      <div class="target">
        <label>Regla CSS (fallback)</label>
        <select id="rule-select"></select>
        <p id="affected-note" class="note"></p>
      </div>
      <div id="controls"></div>
      <div class="panel-foot">
        <button id="btn-undo" title="Deshacer último guardado">↩ Deshacer</button>
        <button id="btn-save" class="primary">💾 Guardar cambios</button>
      </div>
    </aside>

    <!-- Panel de tokens -->
    <aside id="token-panel" class="hidden">
      <div class="panel-head">
        <h2>Design Tokens</h2>
        <button id="btn-close-tokens" class="mini">✕</button>
      </div>
      <p class="note pad">Cambia una variable y se actualiza en toda la web. Seguro: no rompe el layout.</p>
      <div id="token-list"></div>
      <div class="panel-foot">
        <button id="btn-save-tokens" class="primary">💾 Guardar tokens</button>
      </div>
    </aside>
  </main>

  <div id="toast"></div>
  <script src="editor.js"></script>
</body>
</html>
