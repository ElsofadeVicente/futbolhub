<!-- Columnas de anuncio (rascacielos reales). Solo a partir de 1240px:
     por debajo no cabe ninguna unidad de AdSense y el juego se queda
     con toda la pantalla. Ver css/ads.css y js/ads.js. -->
<aside class="ad-col ad-col--left">
  <div class="ad-slot" data-ad="rail-left"></div>
</aside>
<aside class="ad-col ad-col--right">
  <div class="ad-slot" data-ad="rail-right"></div>
</aside>

<!-- ═══════════ PANTALLA 1: INTRO / OBJETIVO ═══════════ -->
<div id="screen-intro" class="screen active">
  <a href="../index.html" class="fh-volver">← Volver</a>

  <div class="sd-intro-wrap">
    <div class="sd-intro-eyebrow">
      <span class="sd-num">№ 12</span>
      <span class="sd-sep">·</span>
      <span class="sd-cat">Superdraft</span>
      <span class="sd-sep">·</span>
      <span id="sd-day-label" class="sd-day">#1</span>
    </div>

    <p class="sd-intro-kicker">EL OBJETIVO DE HOY</p>
    <h1 id="sd-obj-title" class="sd-intro-title">EL ONCE MÁS VIEJO</h1>
    <div id="sd-obj-formation" class="sd-intro-formation">Formación 3-4-3</div>
    <p id="sd-obj-hint" class="sd-intro-hint"></p>

    <button id="sd-start-btn" class="btn-primary">JUGAR ▶</button>

    <!-- Navegación de días (archivo) -->
    <div id="day-nav" class="sd-daynav">
      <button id="nav-first" title="Primera edición" aria-label="Primera edición">«</button>
      <button id="nav-prev"  title="Anterior" aria-label="Anterior">‹</button>
      <span id="nav-label">#1</span>
      <button id="nav-next"  title="Siguiente" aria-label="Siguiente">›</button>
      <button id="nav-last"  title="Hoy" aria-label="Hoy">»</button>
      <!-- Enlace a la guía del juego (ver CLAUDE.md, "Páginas de contenido"). -->
      <p class="guia-link"><a href="/como-jugar/superdraft/">Cómo se juega &rarr;</a></p>
    </div>
  </div>
</div>

<!-- ═══════════ PANTALLA 2: PARTIDA ═══════════ -->
<div id="screen-game" class="screen">
  <a href="../index.html" class="fh-volver">← Volver</a>

  <div class="sd-game-wrap">
    <!-- Campo -->
    <div id="sd-field" class="sd-field"><!-- generado por JS --></div>

    <!-- Requisito de la ronda: escudo / bandera + nombre -->
    <div class="sd-panel">
      <div id="sd-reel" class="sd-req">
        <div class="sd-req-frame"><img id="sd-reel-img" alt="" /></div>
        <div id="sd-reel-label" class="sd-req-name"></div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════ PANTALLA 3: FIN ═══════════ -->
<div id="screen-end" class="screen">
  <div class="sd-end-wrap">
    <div class="sd-intro-eyebrow">
      <span class="sd-num">№ 12</span><span class="sd-sep">·</span>
      <span class="sd-cat">Resultado</span>
    </div>
    <div class="sd-end-emoji">🧮</div>
    <h2 id="sd-end-title" class="sd-end-title">EL ONCE MÁS VIEJO</h2>
    <div id="sd-end-total" class="sd-end-total">0</div>
    <p id="sd-end-best" class="sd-end-best"></p>
    <div class="sd-end-actions">
      <button id="sd-share-btn" class="btn-primary">📤 Compartir</button>
      <button id="sd-replay-btn" class="btn-primary">🔄 Reintentar</button>
      <button id="sd-menu-btn" class="btn-secondary">Objetivo</button>
      <a href="../index.html" class="btn-secondary">🏠 Hub</a>
    </div>
  </div>
</div>

<!-- Carga -->
<div id="loading-overlay" class="loading-overlay">
  <div class="loading-inner">
    <div class="loading-title">SUPERDRAFT</div>
    <div class="loading-spinner"></div>
    <div class="loading-text" id="sd-loading-text">Cargando base de datos…</div>
  </div>
</div>

<!-- Modal: buscar jugador para la posición pulsada -->
<div id="pick-modal" class="sd-modal hidden">
  <div class="sd-modal-backdrop" onclick="SD.closePick()"></div>
  <div class="sd-modal-card">
    <button class="sd-modal-x" onclick="SD.closePick()" aria-label="Cerrar">✕</button>
    <h3 class="sd-modal-title">Buscar jugador</h3>
    <p class="sd-modal-sub" id="sd-modal-sub"></p>
    <div class="sd-input-wrap">
      <input id="player-input" class="player-input" type="text"
             placeholder="Buscar jugador…" autocomplete="off" maxlength="60"
             oninput="SD.onInput()" onkeydown="SD.onKey(event)" />
      <div class="autocomplete-list hidden" id="autocomplete-list"></div>
    </div>
    <div class="sd-modal-actions">
      <button class="btn-secondary" onclick="SD.closePick()">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
