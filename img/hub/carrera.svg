<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150" role="img" aria-label="La Carrera">
  <rect width="400" height="150" fill="#f4ead2"/>
  <rect width="400" height="150" fill="none"/>
  <!-- línea de carrera -->
  <line x1="40" y1="98" x2="360" y2="98" stroke="#0f120e" stroke-width="2.5"/>
  <!-- nodos de clubes (escudos estilizados), tamaño creciente -->
  <g stroke="#0f120e" stroke-width="2.5">
    <path d="M64 98 v0 M64 82 l10 5 v10 l-10 5 -10 -5 v-10 z" fill="#ede0c0"/>
    <path d="M140 98 M140 78 l13 6 v13 l-13 6 -13 -6 v-13 z" fill="#ede0c0"/>
    <path d="M226 98 M226 74 l16 7 v15 l-16 8 -16 -8 v-15 z" fill="#fff"/>
    <path d="M330 98 M330 68 l20 9 v18 l-20 10 -20 -10 v-18 z" fill="#b5221e"/>
  </g>
  <!-- puntos base -->
  <g fill="#0f120e">
    <circle cx="64" cy="98" r="3.5"/>
    <circle cx="140" cy="98" r="3.5"/>
    <circle cx="226" cy="98" r="3.5"/>
    <circle cx="330" cy="98" r="3.5"/>
  </g>
  <!-- balón sobre el último club -->
  <circle cx="330" cy="86" r="7" fill="#f4ead2" stroke="#0f120e" stroke-width="2"/>
  <path d="M330 81 l4 3 -1.5 4.6 h-5 L326 84 z" fill="#0f120e"/>
  <!-- cabecera tipográfica -->
  <text x="40" y="40" font-family="Anton, Arial Black, sans-serif" font-size="30" fill="#0f120e" letter-spacing="1">LA CARRERA</text>
  <line x1="40" y1="50" x2="360" y2="50" stroke="#0f120e" stroke-width="1" opacity="0.35"/>
  <text x="40" y="126" font-family="'DM Mono', monospace" font-size="9" fill="#b5221e" letter-spacing="3">CLUB · A · CLUB</text>
</svg>
