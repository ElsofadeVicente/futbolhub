<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <filter id="grain2"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="800" height="300" fill="#ede0c0"/>
  <rect width="800" height="300" filter="url(#grain2)" opacity="0.05"/>

  <!-- carta de farol, izquierda -->
  <g transform="translate(300,150) rotate(-12)">
    <rect x="-55" y="-78" width="110" height="156" rx="10" fill="#f4ead2" stroke="#0f120e" stroke-width="5"/>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="64" fill="#b5221e">?</text>
  </g>

  <!-- carta, derecha -->
  <g transform="translate(500,150) rotate(10)">
    <rect x="-55" y="-78" width="110" height="156" rx="10" fill="#f4ead2" stroke="#0f120e" stroke-width="5"/>
    <text x="0" y="14" text-anchor="middle" font-family="Georgia, serif" font-weight="700" font-size="64" fill="#0f120e">?</text>
  </g>

  <!-- ojo entornado / cara de farol, centro -->
  <g transform="translate(400,110)" fill="none" stroke="#0f120e" stroke-width="5" stroke-linecap="round">
    <path d="M -34,4 Q 0,-16 34,4" />
    <path d="M -20,4 Q 0,10 20,4" opacity="0.6"/>
  </g>

  <text x="400" y="255" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-style="italic" font-weight="700" font-size="30" fill="#0f120e">El Mentiroso</text>
</svg>
