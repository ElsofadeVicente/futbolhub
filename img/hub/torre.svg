<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="800" height="300" fill="#ede0c0"/>
  <rect width="800" height="300" filter="url(#grain)" opacity="0.05"/>

  <!-- torre / rook silhouette, centrada -->
  <g transform="translate(400,150)" fill="none" stroke="#0f120e" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- corona de torreón -->
    <path d="M -70,-90 L -70,-60 L -50,-60 L -50,-80 L -30,-80 L -30,-60 L -10,-60 L -10,-80 L 10,-80 L 10,-60 L 30,-60 L 30,-80 L 50,-80 L 50,-60 L 70,-60 L 70,-90"/>
    <!-- cuerpo -->
    <path d="M -60,-60 L -45,60 L 45,60 L 60,-60"/>
    <!-- base -->
    <path d="M -75,60 L 75,60 L 65,95 L -65,95 Z"/>
    <!-- lineas del cuerpo -->
    <path d="M -30,-40 L -22,50 M 30,-40 L 22,50" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- pieza que se cae, a la derecha -->
  <g transform="translate(560,190) rotate(24)" fill="none" stroke="#b5221e" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="0.9">
    <path d="M -22,-30 L -22,-18 L -14,-18 L -14,-26 L -4,-26 L -4,-18 L 6,-18 L 6,-26 L 16,-26 L 16,-18 L 22,-18 L 22,-30"/>
    <path d="M -18,-18 L -13,20 L 13,20 L 18,-18"/>
    <path d="M -24,20 L 24,20 L 20,32 L -20,32 Z"/>
  </g>

  <text x="400" y="255" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-style="italic" font-weight="700" font-size="30" fill="#0f120e">La Torre</text>
</svg>
